[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigilant"
version = "1.0.0"
description = "A mini SOC pipeline: log ingestion, Sigma + correlation detection, threat-intel enrichment, triage scoring and SOAR-style playbooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sigilant = "sigilant.cli:main"

[tool.setuptools.packages.find]
include = ["sigilant*"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["UP037", "B905"]

[tool.ruff.lint.per-file-ignores]
"sigilant/simulate.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
