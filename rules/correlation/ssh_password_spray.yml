id: corr-ssh-password-spray
title: SSH Password Spraying
type: distinct_count
level: high
description: One source IP failing SSH logins against many different usernames.
tags: [attack.credential_access, attack.t1110.003]
filter:
  event.dataset: linux.auth
  event.action: ssh_login
  event.outcome: failure
group_by: [source.ip]
distinct_field: user.name
timeframe: 10m
threshold: 5
falsepositives:
  - Internal vulnerability scanners with credentialed checks.
