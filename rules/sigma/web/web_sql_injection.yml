title: SQL Injection Attempt in URL
id: 6c7e2b1a-41d4-4f0e-9b1e-0a2f6d3c5e14
status: test
description: Common SQL injection payloads in the (URL-decoded) request.
author: Sigilant
tags: [attack.initial_access, attack.t1190]
logsource:
  category: webserver
detection:
  selection:
    url.decoded|contains: ['union select', 'union all select', "' or '1'='1", "' or 1=1", 'or 1=1--',
                           'sleep(', 'benchmark(', 'information_schema', 'xp_cmdshell', '@@version']
  condition: selection
falsepositives:
  - Search pages where users legitimately type SQL keywords (rare).
level: high
