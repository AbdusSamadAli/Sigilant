title: Known Vulnerability Scanner User-Agent
id: 6c7e2b1a-41d4-4f0e-9b1e-0a2f6d3c5e16
status: test
description: Request made by a well-known offensive scanning tool.
author: Sigilant
tags: [attack.reconnaissance, attack.t1595.002]
logsource:
  category: webserver
detection:
  selection:
    user_agent.original|contains: ['sqlmap', 'nikto', 'nmap', 'masscan', 'wpscan', 'gobuster',
                                   'dirbuster', 'nuclei', 'zgrab', 'hydra', 'feroxbuster']
  condition: selection
falsepositives:
  - Your own authorised vulnerability scans - filter the scanner's source IP.
level: medium
