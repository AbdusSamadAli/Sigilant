title: Office Application Spawning a Shell or Script Host
id: 6c7e2b1a-41d4-4f0e-9b1e-0a2f6d3c5e02
status: test
description: >
  Word/Excel/PowerPoint/Outlook launching cmd, PowerShell or a script host - the classic sign of a
  malicious macro document delivered by phishing.
author: Sigilant
tags: [attack.initial_access, attack.t1566.001, attack.execution, attack.t1059]
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: ['\winword.exe', '\excel.exe', '\powerpnt.exe', '\outlook.exe', '\onenote.exe']
  selection_child:
    Image|endswith: ['\cmd.exe', '\powershell.exe', '\pwsh.exe', '\wscript.exe', '\cscript.exe',
                     '\mshta.exe', '\rundll32.exe', '\regsvr32.exe']
  condition: selection_parent and selection_child
falsepositives:
  - Rare legitimate add-ins; verify the document and the user.
level: high
