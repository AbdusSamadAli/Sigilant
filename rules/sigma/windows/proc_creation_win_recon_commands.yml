title: Domain Reconnaissance Commands
id: 6c7e2b1a-41d4-4f0e-9b1e-0a2f6d3c5e05
status: test
description: Built-in tools used to enumerate the current user, domain admins and domain controllers.
author: Sigilant
tags: [attack.discovery, attack.t1087.002, attack.t1033]
logsource:
  product: windows
  category: process_creation
detection:
  selection_whoami:
    Image|endswith: '\whoami.exe'
    CommandLine|contains: ['/all', '/priv', '/groups']
  selection_net:
    Image|endswith: ['\net.exe', '\net1.exe']
    CommandLine|contains: ['domain admins', 'enterprise admins', 'group /domain', 'user /domain']
  selection_nltest:
    Image|endswith: '\nltest.exe'
    CommandLine|contains: ['/dclist', '/domain_trusts']
  condition: 1 of selection_*
falsepositives:
  - IT staff troubleshooting; correlate with other activity on the host.
level: low
