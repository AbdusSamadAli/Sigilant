name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sigilant tests
      - name: Validate detection rules
        run: sigilant rules validate --strict
      - name: Detection regression test (every rule must fire on the lab scenario)
        run: sigilant rules test
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Run pipeline on lab dataset
        run: |
          sigilant simulate --out samples
          sigilant run --input samples --out output --offline
          sigilant rules export --target splunk > output/rules_splunk.spl
          sigilant rules export --target kql > output/rules_sentinel.kql
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sigilant-report
          path: output/
